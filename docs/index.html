<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://*.supabase.co; img-src 'self' data:; manifest-src 'self'; base-uri 'none'; form-action 'none'">
  <title>PEP</title>
  <meta name="theme-color" content="#FFE500">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <header class="kopf">
    <h1>PEP</h1>
    <p id="kopf-filiale" class="kopf-filiale"></p>
    <p id="wer" class="wer"></p>
  </header>
  <nav id="navigation" class="reiterleiste" hidden>
    <button type="button" class="reiter-knopf" data-ziel="start">Start</button>
    <button type="button" class="reiter-knopf" data-ziel="abwesenheiten">Abwesenheiten</button>
    <button type="button" class="reiter-knopf" data-ziel="vorausplanung">Vorausplanung</button>
    <button type="button" class="reiter-knopf" data-ziel="einsatzplan">Einsatzplan</button>
    <button type="button" class="reiter-knopf" data-ziel="zeitkonto">Zeitkonto</button>
    <button type="button" class="reiter-knopf" data-ziel="mitarbeiter">Mitarbeiter</button>
    <button type="button" class="reiter-knopf" data-ziel="einstellungen" id="nav-einstellungen" hidden>Einstellungen</button>
    <button type="button" class="reiter-knopf rechts" id="abmelden">Abmelden</button>
    <button type="button" class="hilfe-knopf" id="hilfe-knopf" aria-label="Hilfe zu dieser Seite" title="Hilfe zu dieser Seite">?</button>
  </nav>

  <main>
    <p id="meldung" class="meldung" role="alert" hidden></p>

    <section id="ansicht-login" hidden>
      <form id="login-form" class="box formular-box" novalidate>
        <h2>Anmelden</h2>
        <label class="feld">Benutzername
          <input id="login-name" type="text" autocomplete="username" autocapitalize="none" required>
        </label>
        <label class="feld">Passwort
          <input id="login-passwort" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit" id="login-knopf">Anmelden</button>
      </form>
    </section>

    <section id="ansicht-registrieren" hidden>
      <form id="reg-form" class="box formular-box" novalidate hidden>
        <h2>Zugang einrichten</h2>
        <p>Wähle einen Benutzernamen und ein Passwort. Damit meldest du dich danach an.</p>
        <label class="feld">Benutzername
          <input id="reg-name" type="text" autocomplete="username" autocapitalize="none" required>
        </label>
        <label class="feld">Passwort (mindestens 10 Zeichen)
          <input id="reg-passwort" type="password" autocomplete="new-password" required>
        </label>
        <label class="feld">Passwort wiederholen
          <input id="reg-passwort2" type="password" autocomplete="new-password" required>
        </label>
        <button type="submit" id="reg-knopf">Zugang einrichten</button>
      </form>
      <p class="mein-zurueck"><button type="button" class="knopf" id="reg-zum-login">Zur Anmeldung</button></p>
    </section>

    <section id="ansicht-zustimmung" hidden></section>
    <section id="ansicht-mein" hidden></section>

    <section id="ansicht-filiale" hidden>
      <form id="filiale-form" class="box formular-box" novalidate>
        <h2>Filiale anlegen</h2>
        <p>Es ist noch keine Filiale angelegt. Bitte lege sie jetzt an.</p>
        <label class="feld">Name
          <input id="filiale-name" type="text" required>
        </label>
        <label class="feld">Nummer
          <input id="filiale-nummer" type="text" inputmode="numeric">
        </label>
        <label class="feld">Bundesland
          <select id="filiale-land" required>
            <option value="">Bitte wählen</option>
            <option value="BW">Baden-Württemberg</option>
            <option value="BY">Bayern</option>
            <option value="BE">Berlin</option>
            <option value="BB">Brandenburg</option>
            <option value="HB">Bremen</option>
            <option value="HH">Hamburg</option>
            <option value="HE">Hessen</option>
            <option value="MV">Mecklenburg-Vorpommern</option>
            <option value="NI">Niedersachsen</option>
            <option value="NW">Nordrhein-Westfalen</option>
            <option value="RP">Rheinland-Pfalz</option>
            <option value="SL">Saarland</option>
            <option value="SN">Sachsen</option>
            <option value="ST">Sachsen-Anhalt</option>
            <option value="SH">Schleswig-Holstein</option>
            <option value="TH">Thüringen</option>
          </select>
        </label>
        <button type="submit" id="filiale-knopf">Filiale anlegen</button>
      </form>
    </section>

    <section id="ansicht-start" hidden></section>
    <section id="ansicht-vorausplanung" hidden></section>
    <section id="ansicht-einsatzplan" hidden></section>
    <section id="ansicht-zeitkonto" hidden></section>
    <section id="ansicht-mitarbeiter" hidden>
      <div class="zweispaltig">
        <aside id="ma-liste"></aside>
        <div id="ma-karte"></div>
      </div>
    </section>
    <section id="ansicht-einstellungen" hidden></section>
    <section id="ansicht-abwesenheiten" hidden></section>
    <!-- Druckansicht (druck.js): am Bildschirm nie sichtbar, beim Drucken das Einzige (style.css, @media print) -->
    <section id="ansicht-druck" class="druckansicht" hidden></section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
